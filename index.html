<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>살면서 써먹는 경제·투자 만화교과서</title>
<style>body{margin:0;background:#f4efe7;font-family:system-ui,'Noto Sans KR',sans-serif;color:#252525}.wrap{max-width:900px;margin:auto;padding:24px 16px 80px}header,.chapter{background:#fff;border-radius:16px;padding:20px;margin:12px 0;box-shadow:0 3px 14px #0001}h1{margin:0 0 8px}.chapter img{width:100%;display:block;border-radius:10px;margin-top:10px}.meta{color:#6d6258;font-size:14px}a{color:#b44a28;font-weight:700}</style></head>
<body><main class="wrap"><header><h1>살면서 써먹는 경제·투자 만화교과서</h1><p>투자자산운용사 제8장 거시경제 · 제9장 분산투자기법</p></header><h2>제1부 거시경제</h2><div id="macro"></div><h2>제2부 분산투자기법</h2><div id="portfolio"></div></main>
<script>
const items=[
['01','금리가 오르면 내 생활은 어떻게 달라질까?','금리·대출·예금·소비','금리는 돈을 빌리거나 맡길 때 적용되는 가격이다. 금리 변화는 대출이자와 예금이자, 소비와 투자에 영향을 준다.'],['02','물가는 왜 오를까?','물가·구매력·실질수익률','물가가 지속적으로 오르면 같은 돈으로 살 수 있는 양이 줄어든다. 명목수익률에서 물가를 빼 실제 구매력을 생각해야 한다.'],['03','경기가 좋다는데 왜 내 지갑은 가벼울까?','경기지표·체감경기','경기는 생산·고용·소비·투자 등 여러 지표로 판단하며, 개인의 체감경기는 소득과 물가에 따라 다를 수 있다.'],['04','환율이 오르면 해외투자는 어떻게 될까?','환율·환헤지','해외자산의 원화 수익률은 자산가격과 환율의 영향을 함께 받는다. 환헤지는 환율 변동을 줄이지만 비용이 든다.'],['05','중앙은행은 왜 금리를 움직일까?','통화정책·정책 시차','통화정책은 금리와 유동성을 조절해 물가와 경기에 영향을 준다. 효과에는 시차가 있다.'],['06','정부는 언제 지갑을 열까?','재정정책·국가채무','재정정책은 정부 지출과 세금을 조절하는 정책이며, 경기 부양과 함께 적자·부채도 고려해야 한다.'],['07','뉴스 속 숫자를 어떻게 읽을까?','경제지표 읽기','경제지표는 기준시점·비교대상·발표시차를 확인해야 하며 숫자 하나로 투자 결론을 내릴 수 없다.'],['08','한 종목에 몰빵하면 왜 위험할까?','분산투자·개별위험','분산투자는 특정 기업의 개별위험이 전체 자산에 미치는 영향을 줄이는 방법이다.'],['09','같이 오르고 같이 내리면?','상관관계·분산효과','상관관계가 낮은 자산을 섞으면 분산효과가 커질 수 있지만 위기 때 관계가 변할 수 있다.'],['10','여러 자산을 섞으면 무엇이 달라질까?','포트폴리오 위험','포트폴리오 위험은 개별위험·자산비중·상관관계를 함께 반영한다.'],['11','없앨 수 있는 위험과 없는 위험','체계적·비체계적 위험','비체계적 위험은 분산으로 줄일 수 있지만 시장 전체의 체계적 위험은 남을 수 있다.'],['12','수익률만 보면 왜 안 될까?','위험조정성과·샤프지수','위험조정성과는 수익률뿐 아니라 그 수익을 얻기 위해 감수한 위험도 함께 평가한다.'],['13','내 목표에 맞는 자산배분','투자기간·위험수용도','자산배분은 목표·기간·위험수용도·재정 여력을 고려해 정한다.'],['14','시장에 흔들릴 때의 투자 원칙','리밸런싱','리밸런싱은 시장 변화로 달라진 자산 비중을 목표 비중에 맞게 조정하는 과정이다.']];
const qs={
'01':'기준금리가 오를 때 변동금리 대출과 예금에는 어떤 변화가 생길까?',
'02':'명목수익률이 6%이고 물가상승률이 3%라면 실질 구매력은 어떻게 생각해야 할까?',
'03':'경제성장률이 올라도 내 체감경기가 나쁠 수 있는 이유는 무엇일까?',
'04':'해외주가가 올랐는데 원화가 강세가 되면 원화 수익률은 어떻게 달라질까?',
'05':'금리 인상 정책이 물가와 경기에는 각각 어떤 영향을 줄 수 있을까?',
'06':'경기 부양을 위한 재정지출이 장기적으로 만들 수 있는 부담은 무엇일까?',
'07':'경제지표를 볼 때 기준시점과 발표시차를 확인해야 하는 이유는 무엇일까?',
'08':'한 종목의 악재를 분산투자가 어떻게 완화할 수 있을까?',
'09':'상관관계가 낮은 자산을 섞는 것이 종목 수를 늘리는 것보다 중요한 이유는 무엇일까?',
'10':'포트폴리오 위험에 자산 비중이 영향을 주는 이유는 무엇일까?',
'11':'분산으로 줄일 수 있는 위험과 줄이기 어려운 위험을 구분해 보자.',
'12':'같은 수익률이라도 위험조정성과가 다를 수 있는 이유는 무엇일까?',
'13':'투자기간이 짧아질수록 자산배분을 다시 검토해야 하는 이유는 무엇일까?',
'14':'목표 비중에서 크게 벗어났을 때 리밸런싱을 고려하는 이유는 무엇일까?'};
const tips={
'01':'대출 금리 유형과 예금 만기를 확인해 금리 변화에 대한 노출을 파악한다.',
'02':'수익률을 볼 때 물가를 함께 보며 현금의 구매력 하락을 고려한다.',
'03':'성장률 하나보다 고용·소비·소득 지표가 내 상황과 맞는지 확인한다.',
'04':'해외투자 수익을 볼 때 현지자산 수익과 환율 효과를 분리해 본다.',
'05':'금리 결정의 방향뿐 아니라 정책 효과가 나타나는 시차를 감안한다.',
'06':'정부정책 기대만으로 투자하지 말고 재정 부담과 민간 영향도 함께 본다.',
'07':'뉴스 숫자의 기준시점과 전망 대비 실제 결과를 확인한다.',
'08':'특정 기업·산업에 자산이 과도하게 몰리지 않았는지 점검한다.',
'09':'자산을 고를 때 과거 수익률뿐 아니라 함께 움직이는 정도를 확인한다.',
'10':'큰 비중의 자산 하나가 전체 위험을 좌우하지 않는지 계산한다.',
'11':'분산으로 줄일 수 있는 위험과 시장 전체 위험을 구분해 기대치를 조정한다.',
'12':'수익률과 변동성을 함께 비교해 같은 수익의 질을 판단한다.',
'13':'목표 시점과 손실을 감당할 수 있는 정도에 맞춰 비중을 정한다.',
'14':'정한 기준에 따라 비중을 조정하고 공포·탐욕에 따른 매매를 줄인다.'};
const cautions={
'01':'고정금리·변동금리와 대출 조건에 따라 영향이 다르다.',
'02':'명목수익률만으로 실제 구매력의 증가를 판단하지 않는다.',
'03':'지표 하나로 경기와 투자 결과를 단정하지 않는다.',
'04':'환헤지는 비용이 들고 환율 상승의 이익을 제한할 수 있다.',
'05':'통화정책은 효과가 나타나기까지 시차가 있다.',
'06':'재정지출에는 적자·부채·민간투자 위축 부담이 따를 수 있다.',
'07':'지표는 과거 또는 현재의 일부를 보여 줄 뿐 미래를 보장하지 않는다.',
'08':'분산해도 시장 전체의 위험은 남을 수 있다.',
'09':'과거 상관관계가 위기 때도 유지된다고 가정하지 않는다.',
'10':'종목 수보다 비중과 자산 간 움직임을 함께 봐야 한다.',
'11':'체계적 위험은 분산만으로 제거하기 어렵다.',
'12':'위험조정성과 지표는 특정 기간과 가정에 기반한다.',
'13':'모든 사람에게 맞는 단일 자산배분 비율은 없다.',
'14':'리밸런싱에는 세금·거래비용과 실행 기준이 필요하다.'};
function card(x){const img=x[0].padStart(3,'0');return `<article class="chapter"><h3>${x[0]}화. ${x[1]}</h3><div class="meta">${x[2]}</div><img loading="lazy" src="chapters/${x[0]}/${img}.png" alt="${x[1]}"><div class="note"><strong>개념 정리</strong><p>${x[3]} ${tips[x[0]]} 다만 ${cautions[x[0]]}</p></div></article>`}document.querySelector('#macro').innerHTML=items.slice(0,7).map(card).join('');document.querySelector('#portfolio').innerHTML=items.slice(7).map(card).join('');
</script></body></html>
